<div class="d-flex justify-content-center align-items-start mb-5">
  <form class="w-25 p-5 border rounded" style="min-width: 400px">
    <h3 class="text-center mb-4">
      <b style="color: #8a8a8a">User Details</b>
    </h3>

    <div class="mb-3">
      <label for="firstName" class="form-label">First Name:</label>
      <input
        type="text"
        id="firstName"
        name="firstName"
        class="form-control"
        [(ngModel)]="user.firstName"
      />
    </div>

    <div class="mb-3">
      <label for="lastName" class="form-label">Last Name:</label>
      <input
        type="text"
        id="lastName"
        name="lastName"
        class="form-control"
        [(ngModel)]="user.lastName"
      />
    </div>

    <div class="mb-3">
      <label for="age" class="form-label">Age:</label>
      <input
        type="range"
        id="age"
        name="age"
        class="form-range"
        min="1"
        max="100"
        [(ngModel)]="user.age"
      />
    </div>

    <div class="mb-3">
      <label for="email" class="form-label">Email:</label>
      <input
        type="email"
        id="email"
        name="email"
        class="form-control"
        [(ngModel)]="user.email"
      />
    </div>

    <div class="mb-3">
      <label for="mobile" class="form-label">Mobile Number:</label>
      <input
        type="tel"
        id="mobile"
        name="mobile"
        class="form-control"
        pattern="[0-9]{10}"
        [(ngModel)]="user.phone"
      />
    </div>

    <div class="mb-3">
      <label for="gender" class="form-label">Gender:</label>
      <select
        id="gender"
        name="gender"
        class="form-select"
        [(ngModel)]="user.gender"
      >
        <option value="male">Male</option>
        <option value="female">Female</option>
        <option value="other">Other</option>
      </select>
    </div>

    <div class="mb-3">
      <label for="street" class="form-label">Street:</label>
      <input
        id="street"
        name="Street"
        class="form-control"
        [(ngModel)]="user.address.street"
      />
    </div>

    <div class="mb-3">
      <label for="street" class="form-label">City:</label>
      <input
        id="city"
        name="city"
        class="form-control"
        [(ngModel)]="user.address.city"
      />
    </div>

    <div class="mb-3">
      <label for="state" class="form-label">State:</label>
      <input
        id="state"
        name="state"
        class="form-control"
        [(ngModel)]="user.address.state"
      />
    </div>

    <div class="mb-3">
      <label for="country" class="form-label">Country:</label>
      <input
        id="country"
        name="country"
        class="form-control"
        [(ngModel)]="user.address.country"
      />
    </div>

    <div class="mb-3">
      <label for="zipcode" class="form-label">Zip:</label>
      <input
        id="zipcode"
        name="zipcode"
        class="form-control"
        [(ngModel)]="user.address.zip"
      />
    </div>

    <button
      type="submit"
      class="btn btn-primary w-100 mt-5 p-3"
      style="
        background: linear-gradient(45deg, #6610f2, #6f42c1, #d63384, #dc3545);
        border: none;
      "
      (click)="onSubmit()"
    >
      Submit
    </button>
  </form>
  <div class="px-4">
    <pre class="p-3 border rounded" style="min-width: 400px">
      {{ user | json }}
    </pre>
  </div>
</div>
